name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  starter-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify baseline and shared contract schemas
        run: python3 scripts/check.py

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

  # starter-contract above is the required status check on main (branch protection), so it keeps
  # its name. The shared workflow installs from uv.lock (uv sync --frozen --all-extras), runs Ruff,
  # mypy ([tool.mypy]) and the whole pytest suite, including the PostgreSQL RLS/migration tests,
  # against a disposable PostgreSQL under a coverage gate.
  lint-and-test:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      python-version: "3.12"
      postgres: true
      format-check: false # follow-up: adopt ruff format
      # Ratchet: measured 88.41% on 2026-10-24 (ADR-0004: threshold = measured, rounded down).
      coverage-threshold: "88"
      test-command: |
        python3 scripts/check.py
        PLATFORM_TEST_DSN="$DATABASE_URL" python -m pytest -q --cov --cov-report=

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
