name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  starter-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify baseline and shared contract schemas
        run: python3 scripts/check.py

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

  # starter-contract above is the required status check on main (branch protection), so it keeps
  # its name; the shared workflow adds Ruff and the same check on the current Python.
  lint-and-test:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      python-version: "3.12"
      install-command: "true" # standard library only: the step just creates the venv for this Python
      format-check: false # follow-up: adopt ruff format
      typecheck-command: "" # follow-up: add [tool.mypy]
      test-command: python3 scripts/check.py && python3 -m unittest discover -s tests -v

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1

  workspace-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLATFORM_TEST_DSN: dbname=postgres user=postgres host=127.0.0.1 port=5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Test runtime with real non-superuser PostgreSQL roles
        run: python -m pytest
